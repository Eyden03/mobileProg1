lay:block}.source{font-size:12px;color:var(--muted);margin-top:7px}.empty{text-align:center;padding:30px;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:12px;padding:28px 10px 40px}.badge{display:inline-block;background:#edf5f0;color:var(--g);padding:4px 8px;border-radius:999px;margin-left:6px;font-size:11px}@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}.q{padding:14px}}

<header><div class="wrap"><h1>Mobile Programming Reviewer</h1><p>Modules 1–7 • works completely offline • instant answer checking</p></div></header>

</section>
<div id="quiz"></div>
</main><footer>Reviewer content is based on the provided Mobile Programming Modules 1–7. Generated questions are clearly labeled.</footer>

let mode='existing', order=[...questions.keys()], answered=new Map();
const quiz=document.getElementById('quiz'), mod=document.getElementById('module');
function filtered(){return order.map(i=>[i,questions[i]]).filter(([i,x])=>(mode==='all'||x.kind==='existing')&&(mod.value==='all'||String(x.module)===mod.value));}
function render(){const list=filtered();quiz.innerHTML='';document.getElementById('total').textContent=list.length;if(!list.length){quiz.innerHTML='<div class="empty">No questions match this filter.</div>';stats();return}list.forEach(([idx,x],n)=>{const d=document.createElement('section');d.className='q';d.innerHTML=`<div class="meta">Question ${n+1} • Module ${x.module} <span class="badge">${x.kind==='existing'?'Existing':'Generated'}</span></div><div class="question-text">${formatQuestion(x.q)}</div><div class="opts"></div><div class="feedback"></div>`;const opts=d.querySelector('.opts');x.o.forEach((label,j)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="letter">${String.fromCharCode(65+j)}.</span><span>${esc(label)}</span>`;b.onclick=()=>answer(idx,j,d);opts.appendChild(b)});if(answered.has(idx)) paint(idx,answered.get(idx),d);quiz.appendChild(d)});stats()}
function answer(idx,j,d){if(answered.has(idx))return;answered.set(idx,j);paint(idx,j,d);stats()}
function paint(idx,j,d){const x=questions[idx],bs=[...d.querySelectorAll('.opt')];bs.forEach((b,k)=>{b.disabled=true;if(k===x.a)b.classList.add('correct');else if(k===j)b.classList.add('wrong')});const f=d.querySelector('.feedback');f.className='feedback show';f.innerHTML=`<b>${j===x.a?'Correct!':'Not quite.'}</b> ${esc(x.ex)}<div class="source">${x.kind==='existing'?'From your existing quiz set':'New practice question based on the provided module'}</div>`}
function stats(){const visible=new Set(filtered().map(([i])=>i));let a=0,c=0;answered.forEach((v,k)=>{if(visible.has(k)){a++;if(v===questions[k].a)c++}});document.getElementById('answered').textContent=a;document.getElementById('correct').textContent=c;document.getElementById('pct').textContent=a?Math.round(c/a*100)+'%':'0%'}
function formatQuestion(s){const t=esc(s);return t.replace(/(&lt;resources&gt;[\s\S]*?&lt;\/resources&gt;)/,m=>`<pre class="code-block">${m}</pre>`)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(z=>z.classList.remove('active'));t.classList.add('active');mode=t.dataset.mode;render()});mod.onchange=render;document.getElementById('reset').onclick=()=>{answered.clear();render()};document.getElementById('shuffle').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}render()};render();
</script></body></html>
